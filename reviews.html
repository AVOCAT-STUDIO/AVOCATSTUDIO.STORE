<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Avocat Studio | 후기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<!-- CANVAS BG (shared) -->
<canvas id="hero-canvas"></canvas>
<div class="particles" id="particles"></div>

<!-- ─── NAV ─── -->
<nav>
  <div class="nav-inner">
    <div class="logo" onclick="goPage(0)">Avocat Studio</div>
    <ul class="nav-links">
      <li><button onclick="goPage(0)" id="nb0">홈</button></li>
      <li><button onclick="goPage(1)" id="nb1">소개</button></li>
      <li><button onclick="goPage(2)" id="nb2">사업</button></li>
      <li><button onclick="goPage(3)" id="nb3">수업</button></li>
      <li><button onclick="goPage(4)" id="nb4">경력</button></li>
      <li><button onclick="goPage(5)" id="nb5">제품</button></li>
      <li><button onclick="goPage(6)" id="nb6">후기</button></li>
    </ul>
    <div class="contact-wrap">
      <button class="contact-btn" onclick="toggleSns()">Contact ▾</button>
      <div class="sns-dropdown" id="sns-drop">
        <button class="sns-item" id="nav-ig">📸 인스타그램</button>
        <button class="sns-item" id="nav-yt">▶️ 유튜브</button>
        <button class="sns-item" id="nav-kk">💬 카카오톡</button>
        <button class="sns-item" id="nav-em">✉️ 이메일</button>
      </div>
    </div>
    <button class="hamburger" onclick="toggleMobile()"><span></span><span></span><span></span></button>
  </div>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <button onclick="goPage(0);toggleMobile()">🏠 홈</button>
  <button onclick="goPage(1);toggleMobile()">👩‍🏫 강사 소개</button>
  <button onclick="goPage(2);toggleMobile()">🌐 사업 소개</button>
  <button onclick="goPage(3);toggleMobile()">📚 수업 안내</button>
  <button onclick="goPage(4);toggleMobile()">🏆 경력</button>
  <button onclick="goPage(5);toggleMobile()">🛒 제품 & 링크</button>
  <button onclick="goPage(6);toggleMobile()">⭐ 후기</button>
  <div class="mobile-sns">
    <button id="mob-ig">📸</button><button id="mob-yt">▶️</button>
    <button id="mob-kk">💬</button><button id="mob-em">✉️</button>
  </div>
</div>


<!-- ════ PAGE 6: REVIEWS ════ -->
<div class="page active" id="page-reviews">
  <div class="sec-wrap">
    <div class="container">
      <div class="section-label reveal">수강생 후기</div>
      <h2 class="section-title reveal">학부모님 <span class="grad-text">생생 후기</span></h2>
      <div class="review-header-grid reveal">
        <div><div class="big-score" id="avg-score">4.8</div><div class="avg-stars" id="avg-stars">★★★★★</div><div style="font-size:13px;color:var(--muted)" id="rv-count">후기 3개</div></div>
        <div class="stars-breakdown" id="bars-wrap"></div>
      </div>
      <div class="review-cards-grid" id="review-cards"></div>
      <div class="write-box reveal">
        <h3>✍️ 후기 작성하기</h3>
        <div style="display:grid;gap:.85rem;margin-top:1rem">
          <div class="rv-row">
            <div class="rv-field"><label>핸드폰 뒷자리 4자리</label><input id="rv-phone" type="text" maxlength="4" placeholder="예: 1234" inputmode="numeric"></div>
            <div class="rv-field"><label>별점</label><div class="star-pick" id="star-pick"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div></div>
          </div>
          <div class="rv-field"><label>후기 내용</label><textarea id="rv-text" placeholder="수업을 들으신 솔직한 후기를 남겨주세요 😊"></textarea></div>
          <div><button class="rv-submit" onclick="submitReview()">후기 등록하기</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- ADMIN FAB -->
<button class="admin-fab" onclick="openAdmin()" title="관리자">⚙️</button>

<!-- ADMIN OVERLAY -->
<div id="admin-overlay">
  <div class="admin-box">
    <div id="admin-pw-view" class="pw-box">
      <div style="font-size:20px;font-weight:700;margin-bottom:.75rem">🔒 관리자 로그인</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:1.25rem">비밀번호를 입력하세요</p>
      <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()">
      <button class="pw-btn" onclick="checkPw()">확인</button>
      <p id="pw-err" style="color:#f87171;font-size:13px;margin-top:.75rem;display:none">비밀번호가 틀렸습니다</p>
      <br><button onclick="closeAdmin()" style="background:none;border:none;color:var(--muted);font-size:13px;margin-top:.85rem;cursor:pointer">취소</button>
    </div>
    <div id="admin-panel" style="display:none">
      <div class="admin-title">⚙️ 관리자 패널<button class="admin-close" onclick="closeAdmin()">×</button></div>
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchATab(0)">Hero</button>
        <button class="admin-tab" onclick="switchATab(1)">수업</button>
        <button class="admin-tab" onclick="switchATab(2)">제품</button>
        <button class="admin-tab" onclick="switchATab(3)">SNS</button>
      </div>
      <div class="admin-pane active" id="at0">
        <div class="asec"><div class="asec-title">Hero 텍스트</div>
          <div class="afield"><label>제목 줄 1</label><input id="a-h1" value="미래를 여는"></div>
          <div class="afield"><label>강조 문구</label><input id="a-h2" value="VR 세상으로"></div>
          <div class="afield"><label>소개 문구</label><textarea id="a-desc">아동을 위한 맞춤형 VR 수업과 메타버스 월드 제작 경험을 제공합니다.</textarea></div>
        </div>
        <div class="asec"><div class="asec-title">통계</div>
          <div class="arow"><div class="afield"><label>경력</label><input id="a-s1" value="4년+"></div><div class="afield"><label>수강생</label><input id="a-s2" value="200+"></div></div>
          <div class="afield"><label>제작 월드</label><input id="a-s3" value="50+"></div>
        </div>
        <button class="asave" onclick="saveHero()">Hero 저장</button>
      </div>
      <div class="admin-pane" id="at1"><div class="asec"><div class="asec-title">수업 카드</div><div id="class-editor"></div></div><button class="asave" onclick="saveClasses()">수업 저장</button></div>
      <div class="admin-pane" id="at2"><div class="asec"><div class="asec-title">제품 편집</div><div id="prod-editor"></div></div><button class="asave" onclick="saveProducts()">제품 저장</button></div>
      <div class="admin-pane" id="at3">
        <div class="asec"><div class="asec-title">SNS & 연락처</div>
          <div class="afield"><label>인스타그램 URL</label><input id="a-ig" placeholder="https://instagram.com/..."></div>
          <div class="afield"><label>유튜브 URL</label><input id="a-yt" placeholder="https://youtube.com/..."></div>
          <div class="afield"><label>카카오톡 채널</label><input id="a-kk" placeholder="https://pf.kakao.com/..."></div>
          <div class="afield"><label>이메일</label><input id="a-em" placeholder="your@email.com"></div>
        </div>
        <button class="asave" onclick="saveSNS()">SNS 저장</button>
      </div>
    </div>
  </div>
</div>


<script>window.ACTIVE_PAGE_INDEX=6;</script>
<script src="script.js"></script>
</body>
</html>
